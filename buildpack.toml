api = "0.7"

[buildpack]
  description = "A Cloud Native Buildpack that contributes and configures the OpenTelemetry Agent"
  homepage = "https://github.com/paketo-buildpacks/opentelemetry"
  id = "paketo-buildpacks/opentelemetry"
  keywords = ["java", "apm", "trace", "opentelemetry"]
  name = "Paketo Buildpack for OpenTelemetry"
  sbom-formats = ["application/vnd.cyclonedx+json", "application/vnd.syft+json"]
  version = "{{.version}}"

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/paketo-buildpacks/opentelemetry/blob/main/LICENSE"

[metadata]
  include-files = ["LICENSE", "NOTICE", "README.md", "linux/amd64/bin/build", "linux/amd64/bin/detect", "linux/amd64/bin/run", "linux/amd64/bin/helper", "linux/arm64/bin/build", "linux/arm64/bin/detect", "linux/arm64/bin/run", "linux/arm64/bin/helper", "buildpack.toml"]
  pre-package = "scripts/build.sh --target linux/amd64 --target linux/arm64"

  [[metadata.configurations]]
    build = true
    default = "false"
    description = "enable the OpenTelemetry Java Trace Agent"
    name = "BP_OPENTELEMETRY_ENABLED"

  [[metadata.dependencies]]
    checksum = "sha256:5f9d1f10056ed2b246fbb19543519b8066cda23d6aff19022dbdb84402d6c3ab"
    cpe = "cpe:2.3:a:open-telemetry:opentelemetry-java-agent:2.33.0:*:*:*:*:*:*:*"
    id = "opentelemetry-java"
    name = "OpenTelemetry Java Agent"
    purl = "pkg:generic/opentelemetry-java@2.33.0"
    sha256 = "5f9d1f10056ed2b246fbb19543519b8066cda23d6aff19022dbdb84402d6c3ab"
    source = "https://github.com/open-telemetry/opentelemetry-java-instrumentation/archive/refs/tags/v2.33.0.tar.gz"
    source-checksum = "sha256:6eea4dd0be7f24b7e05b33f80d1159fb36cfbbfedc3c01c4a5eb4a5483405f0e"
    stacks = ["*"]
    uri = "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.33.0/opentelemetry-javaagent.jar"
    version = "2.33.0"

    [[metadata.dependencies.licenses]]
      type = "Apache-2.0"
      uri = "https://github.com/open-telemetry/opentelemetry-java-instrumentation/blob/main/LICENSE"

  [[metadata.dependencies]]
    checksum = "sha256:e43a270df53c6f423e0ab157be9c27ccc01d5dc3232e162fe54777573db2f149"
    cpe = "cpe:2.3:a:open-telemetry:opentelemetry-java-agent:2.33.1:*:*:*:*:*:*:*"
    id = "opentelemetry-java"
    name = "OpenTelemetry Java Agent"
    purl = "pkg:generic/opentelemetry-java@2.33.1"
    sha256 = "e43a270df53c6f423e0ab157be9c27ccc01d5dc3232e162fe54777573db2f149"
    source = "https://github.com/open-telemetry/opentelemetry-java-instrumentation/archive/refs/tags/v2.33.1.tar.gz"
    source-checksum = "sha256:79a2397684334b8f4c33b8ba2703df9a64f6c408dc5dbbe8073f11288f0cd0f9"
    stacks = ["*"]
    uri = "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.33.1/opentelemetry-javaagent.jar"
    version = "2.33.1"

    [[metadata.dependencies.licenses]]
      type = "Apache-2.0"
      uri = "https://github.com/open-telemetry/opentelemetry-java-instrumentation/blob/main/LICENSE"

  [[metadata.dependency-constraints]]
    constraint = "2.*"
    id = "opentelemetry-java"
    patches = 2

[[stacks]]
  id = "*"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
